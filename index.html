<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090f28">
  <meta name="description" content="개운중학교 제31회 곰솔제 복면개왕 실시간 관객 투표">
  <title>복면개왕 | 학우 투표</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="audience-page">
  <div class="ambient"></div>
  <main class="shell audience-shell">
    <header class="masthead">
      <div class="brand-mark">왕<span>✦</span></div>
      <div>
        <div class="eyebrow">모두가 하나되는 2026 학생회</div>
        <h1 class="brand-name">복면개왕</h1>
      </div>
      <span class="top-live"><span class="live-dot"></span> 투표 참여</span>
    </header>

    <section class="hero">
      <p class="overline">개운중학교 제31회 곰솔제</p>
      <h2>오늘의 무대를<br><em>직접 결정하세요.</em></h2>
      <p class="hero-copy">QR 코드로 참여하는 복면개왕 실시간 학우 투표</p>
    </section>

    <section class="stage-card" aria-live="polite">
      <div class="card-header">
        <span id="roundName" class="round-badge">1라운드</span>
        <span id="phaseBadge" class="status-badge">연결 중</span>
      </div>
      <div class="timer-wrap">
        <p class="small-hint" id="phaseHint">현재 진행 상황을 불러오고 있어요.</p>
        <div class="big-timer" id="timer">--:--</div>
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      </div>

      <div id="votePanel" hidden>
        <p class="prompt">마음에 드는 참가자를 선택해주세요</p>
        <div class="candidates">
          <button type="button" class="candidate" id="chooseA">
            <span class="candidate-symbol">A</span>
            <span class="candidate-name" id="nameA">A 참가자</span>
            <span class="candidate-check">✓</span>
          </button>
          <button type="button" class="candidate" id="chooseB">
            <span class="candidate-symbol">B</span>
            <span class="candidate-name" id="nameB">B 참가자</span>
            <span class="candidate-check">✓</span>
          </button>
        </div>
        <button type="button" id="submitVote" class="primary-btn" disabled>
          투표 확정하기 <span>→</span>
        </button>
        <p class="disclaimer">투표는 제출 후 변경할 수 없습니다.</p>
      </div>

      <div class="message-panel" id="messagePanel">
        <div class="message-icon" id="messageIcon">⌛</div>
        <h3 id="messageTitle">잠시만 기다려주세요</h3>
        <p id="messageBody">운영자의 안내에 따라 투표가 시작됩니다.</p>
      </div>

      <div id="resultPanel" hidden>
        <p class="result-lead">FINAL RESULT</p>
        <h3 class="result-title">최종 투표 결과</h3>
        <div class="result-entry">
          <div class="result-label">
            <span id="resultNameA">A 참가자</span>
            <strong id="resultPctA">0%</strong>
          </div>
          <div class="bar-bg"><div class="bar bar-a" id="resultBarA"></div></div>
          <div class="votes-raw" id="resultVotesA">0표</div>
        </div>
        <div class="result-entry">
          <div class="result-label">
            <span id="resultNameB">B 참가자</span>
            <strong id="resultPctB">0%</strong>
          </div>
          <div class="bar-bg"><div class="bar bar-b" id="resultBarB"></div></div>
          <div class="votes-raw" id="resultVotesB">0표</div>
        </div>
        <div class="winner" id="winner"></div>
        <p class="total-count" id="resultTotal"></p>
      </div>
    </section>

    <p class="service-message" id="serviceMessage" role="status"></p>
    <footer class="site-footer">개운중학교 제31회 곰솔제 <span>✦</span> 복면개왕</footer>
  </main>

  <script src="./config.js"></script>
  <script type="module" src="./assets/audience.js"></script>
</body>
</html>
